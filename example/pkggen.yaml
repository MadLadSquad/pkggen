repositories:
  gentoo: 
    name: "untitled-desktop-overlay"
    description: "An overlay containing Gentoo ebuilds and autogens for the applications and libraries part of the UntitledDesktop project"
    homepage: https://github.com/MadLadSquad/UntitledDesktopOverlay.git
    quality: experimental
    status: unofficial
    feed: https://github.com/MadLadSquad/UntitledDesktopOverlay.git
    priority: 10
    owners:
      - name: MadLadSquad
        email: contact@madladsquad.com
        type: project
    source:
      type: git
      url: https://github.com/MadLadSquad/UntitledDesktopOverlay.git
    copyright:
      years: "2022 - 2027"
      owner: MadLadSquad
      license: MIT License
    thin-manifests: true
    sign-manifests: false
    masters: gentoo
    categories:
      - ude-base
      - ude-apps
      - ude-misc
  rpm-based:
    name: "untitled-desktop-rpm"
    description: "RPM packages for the UntitledDesktop project"
    baseurl: https://rpms.madladsquad.com/
    gpgkey: https://rpms.madladsquad.com/rpmkey.pub
  debian:
    name: "untitled-desktop-deb"
    origin: MadLadSquad
    label: UntitledDesktopDEB
    description: "Debian packages for the UntitledDesktop project"
    architectures: [ amd64, arm64, source ]
    components: [ main ]
    sign-with: default
    suites:
      - codename: trixie
        suite: stable
      - codename: noble
    url: https://debs.madladsquad.com/
    keyring: /usr/share/keyrings/untitled-desktop.gpg
  arch: {}
pkggen:
  generator: "github"
  packages:
    - name: "untitled-cli-parser"
      github:
        user: "MadLadSquad"
        repo: "UntitledCLIParser"
        query: "releases"
        artifacts: [ "untitled-cli-parser-{version}.tar.xz" ]
        transforms:
          - [ "v", "" ]
    - name: "untitled-imgui-framework"
      github:
        user: "MadLadSquad"
        repo: "UntitledImGuiFramework"
        query: "releases"
        artifacts: [ "untitled-imgui-framework-{version}.tar.xz" ]
        transforms:
          - [ "v", "" ]
