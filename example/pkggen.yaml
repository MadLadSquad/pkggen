pkggen:
  generator: "github"
  packages:
    - name: "untitled-cli-parser"
      maintainer: "MadLadSquad <contact@madladsquad.com>"
      author: "MadLadSquad <contact@madladsquad.com>"
      # "any", or a list of architectures. amd64 and arm64 work everywhere, other
      # names (ppc64, riscv, ...) are only used by distributions that know them, like Gentoo
      architectures: [ amd64, arm64 ]
      github:
        user: "MadLadSquad"
        repo: "UntitledCLIParser"
        query: "releases"
        artifacts: [ "untitled-cli-parser-{version}.tar.xz" ]
        transforms:
          - [ "v", "" ]
    - name: "untitled-imgui-framework"
      maintainer: "MadLadSquad <contact@madladsquad.com>"
      author: "MadLadSquad <contact@madladsquad.com>"
      github:
        user: "MadLadSquad"
        repo: "UntitledImGuiFramework"
        query: "releases"
        artifacts: [ "untitled-imgui-framework-{version}.tar.xz" ]
        transforms:
          - [ "v", "" ]
