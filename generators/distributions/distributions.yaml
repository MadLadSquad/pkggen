distributions:
  # `name` must match a generator in repositories/<name>.py and the
  # `repositories.<name>` key in pkggen.yaml.
  - name: rpm-based
    # This list contains the exact repology names of the latest supported releases
    # for the given distributions.
    rp-names:
      # Rawhide and the latest 2 releases
      - "fedora_rawhide"
      - "fedora_44"
      - "fedora_43"

      # openSUSE tumbleweed and the last release
      - "opensuse_tumbleweed"
      - "opensuse_leap_15_6"

      # open mandriva lx rolling and the last release
      - "openmandriva_rolling"
      - "openmandriva_6_0"

    # Allows for searching for older releases.
    rp-names-wildcards:
      - "fedora"
      - "opensuse"
      - "openmandriva"
  - name: debian
    rp-names:
      # Debian unstable, testing and the last 2 stable releases
      - "debian_unstable"
      - "debian_14"
      - "debian_13"
      - "debian_12"

      # The latest Ubuntu release and the supported LTS releases
      - "ubuntu_26_10"
      - "ubuntu_26_04"
      - "ubuntu_24_04"
      - "ubuntu_22_04"
    rp-names-wildcards:
      - "debian"
      - "ubuntu"
  - name: arch
    rp-names: [ "arch" ]
  - name: gentoo
    rp-names: [ "gentoo" ]
  - name: alpine
    # Edge and the two newest stable branches
    rp-names:
      - "alpine_edge"
      - "alpine_3_24"
      - "alpine_3_23"
    rp-names-wildcards:
      - "alpine"
  - name: void
    # Void is a rolling release: repology has one repository for it
    rp-names: [ "void_x86_64" ]
    # `targets` gives the test targets of an rp-name that has more than one. Their
    # names can be used wherever an rp-name can (a package's `versions`, `-t`).
    # Void's glibc and musl builds share repology's void_x86_64
    targets:
      void_x86_64: [ "void-glibc", "void-musl" ]
