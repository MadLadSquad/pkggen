name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: "Also run the live tests against the real GitHub and repology APIs"
        type: boolean
        default: false

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Repository creation, fetching and packaging must work on every OS
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python: [ "3.10", "3.x" ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: src/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r src/requirements-dev.txt
      - name: Run tests
        run: python -m pytest

  live:
    name: Live tests
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: src/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r src/requirements-dev.txt
      - name: Run live tests
        run: python -m pytest tests/live --live
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
